# Python API client package of an app - generated from its swagger JSON, built, tested and published.
#
# The app supplies no pyproject or lockfile: the generator and the runtime package (hiveio-api-client) versions are
# pinned below, the client subclasses `hiveio_api_client.AbstractAsyncApi` and the wheel depends only on
# hiveio-api-client (no beekeepy, no hiveio-api).
#
# Requires common-ci-configuration's templates/python_projects.gitlab-ci.yml (`PYTHON_IMAGE`). Usage in an app:
#
#   include:
#     - project: 'hive/wax-spec-generator'
#       ref: main
#       file: '/templates/python_api_package.gitlab-ci.yml'
#
#   variables:
#     PYTHON_API_SWAGGER_JSON: "${CI_PROJECT_DIR}/build/swagger-doc.json"   # artifact of extract-swagger-json
#     PYTHON_API_DISTRIBUTION_NAME: "hiveio-balance-api"
#     PYTHON_API_PACKAGE_NAME: "hiveio_balance_api"
#     PYTHON_API_NAMESPACE: "balance_api_client"   # subpackage of the client: hiveio_balance_api.balance_api_client
#
#   generate_python_api_client:
#     extends: .python_api_package_generate
#     stage: build
#     needs: [{ job: extract-swagger-json, artifacts: true }]
#
#   build_python_api_client_wheel:
#     extends: .python_api_package_build
#     stage: build
#     needs: [{ job: generate_python_api_client, artifacts: true }]
#
#   test_python_api_wheel:
#     extends: .python_api_package_test
#     stage: test
#     needs: [{ job: build_python_api_client_wheel, artifacts: true }]
#
#   deploy_python_api_packages_to_gitlab:
#     extends: .python_api_package_publish
#     stage: publish
#     needs: [{ job: build_python_api_client_wheel, artifacts: true }, { job: test_python_api_wheel }]

.python_api_package_base:
  image: "${PYTHON_IMAGE}"
  variables:
    # pinned by this template - apps get new versions when the template is updated
    PYTHON_API_GENERATOR_REQUIREMENT: "hiveio-api-client-generator==1.7.1.post20261105045512"
    PYTHON_API_CLIENT_RUNTIME_REQUIREMENT: ">=1.7.1.post0,<2"
    # the hive group registry, forwarding other packages to PyPI
    PYTHON_API_INDEX_URL: "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple"
    PYTHON_API_PIP_EXTRA_ARGS: ""  # e.g. `--find-links <directory>` to install packages not published yet
    PYTHON_API_PACKAGE_DIR: "python-api-package"  # relative to CI_PROJECT_DIR - the generated Poetry project
    PYTHON_API_DIST_DIR: "python-api-package/dist"
  before_script:
    - |
      for name in PYTHON_API_SWAGGER_JSON PYTHON_API_DISTRIBUTION_NAME PYTHON_API_PACKAGE_NAME PYTHON_API_NAMESPACE; do
        if [ -z "${!name:-}" ]; then echo "Set ${name} to use the python_api_package template" >&2; exit 1; fi
      done
    - cd "${CI_PROJECT_DIR}"
    - python3 -m venv "${HOME}/python-api-package-venv"
    - source "${HOME}/python-api-package-venv/bin/activate"
    - python3 -V

.python_api_package_generate:
  extends: .python_api_package_base
  script:
    - pip install --index-url "${PYTHON_API_INDEX_URL}" ${PYTHON_API_PIP_EXTRA_ARGS} "${PYTHON_API_GENERATOR_REQUIREMENT}"
    - rm -rf "${PYTHON_API_PACKAGE_DIR}"
    - mkdir -p "${PYTHON_API_PACKAGE_DIR}/${PYTHON_API_PACKAGE_NAME}/${PYTHON_API_NAMESPACE}"
    - echo '__version__ = "0.0.0"' > "${PYTHON_API_PACKAGE_DIR}/${PYTHON_API_PACKAGE_NAME}/__init__.py"
    - touch "${PYTHON_API_PACKAGE_DIR}/${PYTHON_API_PACKAGE_NAME}/py.typed"
    - touch "${PYTHON_API_PACKAGE_DIR}/${PYTHON_API_PACKAGE_NAME}/${PYTHON_API_NAMESPACE}/__init__.py"
    - |
      python3 - <<'EOF'
      import os
      from pathlib import Path

      from api_client_generator.rest import generate_api_client_from_swagger

      generate_api_client_from_swagger(
          Path(os.environ["PYTHON_API_SWAGGER_JSON"]),
          Path(os.environ["PYTHON_API_PACKAGE_DIR"]) / os.environ["PYTHON_API_PACKAGE_NAME"] / os.environ["PYTHON_API_NAMESPACE"],
          "AbstractAsyncApi",
          "hiveio_api_client",
      )
      EOF
    - |
      cat > "${PYTHON_API_PACKAGE_DIR}/pyproject.toml" <<EOF
      [build-system]
      requires = ["poetry-core==2.1.3", "poetry-dynamic-versioning==1.9.1"]
      build-backend = "poetry_dynamic_versioning.backend"

      [tool.poetry]
      name = "${PYTHON_API_DISTRIBUTION_NAME}"
      version = "0.0.0"
      description = "Python API client of ${CI_PROJECT_PATH}, generated by hiveio-api-client-generator"
      authors = []
      packages = [{ include = "${PYTHON_API_PACKAGE_NAME}" }]
      include = [{ path = "${PYTHON_API_PACKAGE_NAME}/**/*", format = ["wheel", "sdist"] }]

      [tool.poetry.dependencies]
      python = ">=3.12,<4"
      hiveio-api-client = "${PYTHON_API_CLIENT_RUNTIME_REQUIREMENT}"

      [tool.poetry-dynamic-versioning]
      enable = true
      pattern = "default-unprefixed"
      # As in python/pyproject.toml of hive/wax-spec-generator: tags, tag + .post{timestamp} on develop/master/main,
      # tag + .dev{timestamp}+unstable on other branches.
      format-jinja = """
          {%- set STABLE_BRANCHES = ['develop', 'master', 'main'] -%}

          {%- set effective_branch = branch or env.get('CI_COMMIT_REF_NAME') -%}
          {%- set is_on_tag = distance == 0 -%}
          {%- set is_after_tag = distance > 0 -%}
          {%- set is_tag_checkout = branch is none and is_on_tag -%}
          {%- set is_stable = effective_branch in STABLE_BRANCHES or is_tag_checkout -%}
          {%- set is_feature_branch = is_after_tag and not is_stable -%}

          {%- set post = timestamp|int if is_after_tag and not is_feature_branch else none -%}
          {%- set dev = timestamp|int if is_feature_branch else none -%}
          {%- set local_parts = ['unstable'] if is_feature_branch else [] -%}
          {%- set local_parts = local_parts + ['dirty'] if dirty else local_parts -%}

          {{- serialize_pep440(base, stage, revision, post=post, dev=dev, metadata=local_parts) -}}
      """

      [tool.poetry-dynamic-versioning.substitution]
      files = ["${PYTHON_API_PACKAGE_NAME}/__init__.py"]
      EOF
    - cat "${PYTHON_API_PACKAGE_DIR}/pyproject.toml"
    - find "${PYTHON_API_PACKAGE_DIR}" -name '*.py' | sort
  artifacts:
    expire_in: 1 week
    paths:
      - "${PYTHON_API_PACKAGE_DIR}"

.python_api_package_build:
  extends: .python_api_package_base
  variables:
    GIT_DEPTH: 0  # the version is given by tags of the app (dynamic versioning)
    # Submodules updated with `--remote` differ from the commits recorded in the app and would make the version dirty.
    GIT_SUBMODULE_STRATEGY: none
  script:
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    # The generated project is not part of the app sources - only it is ignored, other changes still mark the version dirty.
    - GIT_EXCLUDE_FILE="$(git rev-parse --git-path info/exclude)"
    - mkdir -p "$(dirname "${GIT_EXCLUDE_FILE}")"
    - echo "/${PYTHON_API_PACKAGE_DIR}/" >> "${GIT_EXCLUDE_FILE}"
    # Submodules left at other commits (e.g. by a reused checkout of the runner) are not app sources either. Dynamic
    # versioning checks `git describe --dirty` and `git status --porcelain`: both honor `submodule.<name>.ignore`, while
    # `git describe` ignores `diff.ignoreSubmodules`. A gitlink missing in .gitmodules is named by its path.
    - |
      { git config --file .gitmodules --name-only --get-regexp '^submodule\..*\.path$' 2>/dev/null | sed 's/\.path$//' || true
        git ls-files --stage | sed -n 's/^160000 [0-9a-f]* [0-9]*\t/submodule./p'
      } | while read -r submodule; do git config "${submodule}.ignore" all; done
    - git status --porcelain --ignore-submodules=none  # unfiltered - submodules at other commits show here only
    - git status --porcelain  # dynamic versioning adds `dirty` to the version when this prints anything
    - pip wheel --no-deps --wheel-dir "${PYTHON_API_DIST_DIR}" "./${PYTHON_API_PACKAGE_DIR}"
    - ls -al "${PYTHON_API_DIST_DIR}"
  artifacts:
    expire_in: 1 week
    paths:
      - "${PYTHON_API_DIST_DIR}"

.python_api_package_test:
  extends: .python_api_package_base
  script:
    - pip install --index-url "${PYTHON_API_INDEX_URL}" ${PYTHON_API_PIP_EXTRA_ARGS} "${PYTHON_API_DIST_DIR}"/*.whl
    - pip list
    - |
      python3 - <<'EOF'
      import importlib
      import os
      import pkgutil
      import re
      import sys
      from importlib.metadata import distributions, version

      def normalized(name: str) -> str:
          return re.sub(r"[-_.]+", "-", name).lower()

      package = os.environ["PYTHON_API_PACKAGE_NAME"]
      client = importlib.import_module(f"{package}.{os.environ['PYTHON_API_NAMESPACE']}")
      for module in pkgutil.walk_packages(client.__path__, f"{client.__name__}."):
          importlib.import_module(module.name)

      errors = []
      package_version = version(os.environ["PYTHON_API_DISTRIBUTION_NAME"])
      if package_version == "0.0.0":
          errors.append("The version of the package is the placeholder 0.0.0 - dynamic versioning did not run")
      if "dirty" in package_version:
          errors.append(f"The version of the package {package_version} is dirty - the work tree of the build was modified")
      installed = {normalized(distribution.metadata["Name"]) for distribution in distributions()}
      if "hiveio-api-client" not in installed:
          errors.append("hiveio-api-client (the runtime package) is not installed with the package")
      if forbidden := installed & {"hiveio-beekeepy", "hiveio-api", "hiveio-schemas"}:
          errors.append(f"The package pulls dependencies it must not have: {sorted(forbidden)}")
      print(f"{package} {package_version}, installed distributions: {sorted(installed)}")
      sys.exit("\n".join(errors) if errors else 0)
      EOF

.python_api_package_publish:
  extends: .python_api_package_base
  rules:
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG
      when: on_success
  variables:
    PYTHON_API_TWINE_REQUIREMENT: "twine==6.2.0"  # pinned by this template, like the generator
    TWINE_USERNAME: "gitlab-ci-token"
    TWINE_PASSWORD: "${CI_JOB_TOKEN}"
  script:
    - pip install "${PYTHON_API_TWINE_REQUIREMENT}"
    - twine --version
    # The GitLab registry does not support `twine upload --skip-existing` (twine 7 refuses the option): a wheel already
    # in the simple index of the registry is not uploaded. A failed upload fails the job unless all its wheels are in
    # the index afterwards - pipelines of other branches on the same commit build and publish the same files.
    - |
      python3 - <<'EOF'
      import base64
      import os
      import re
      import subprocess
      import sys
      import urllib.error
      import urllib.request
      from html.parser import HTMLParser
      from pathlib import Path
      from urllib.parse import unquote, urlsplit

      class FileNames(HTMLParser):
          def __init__(self) -> None:
              super().__init__()
              self.names: set[str] = set()

          def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
              href = dict(attrs).get("href")
              if tag == "a" and href:
                  self.names.add(unquote(urlsplit(href).path.rsplit("/", 1)[-1]))

          def handle_data(self, data: str) -> None:
              self.names.add(data.strip())

      class NoRedirect(urllib.request.HTTPRedirectHandler):
          # GitLab redirects requests of packages it does not have to PyPI (package forwarding) - not followed, so the
          # job token is not sent there.
          def redirect_request(self, *args, **kwargs):
              return None

      repository_url = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/packages/pypi"
      credentials = base64.b64encode(f"{os.environ['TWINE_USERNAME']}:{os.environ['TWINE_PASSWORD']}".encode()).decode()
      opener = urllib.request.build_opener(NoRedirect)

      def published_file_names(distribution: str) -> set[str]:
          normalized = re.sub(r"[-_.]+", "-", distribution).lower()
          request = urllib.request.Request(
              f"{repository_url}/simple/{normalized}", headers={"Authorization": f"Basic {credentials}"}
          )
          try:
              with opener.open(request, timeout=60) as response:
                  parser = FileNames()
                  parser.feed(response.read().decode())
                  return parser.names
          except urllib.error.HTTPError as error:
              if error.code == 404 or 300 <= error.code < 400:
                  return set()
              sys.exit(f"Checking whether {distribution} is published in {repository_url} failed: {error}")

      wheels = sorted(Path(os.environ["PYTHON_API_DIST_DIR"]).glob("*.whl"))
      if not wheels:
          sys.exit(f"No wheels to publish in {os.environ['PYTHON_API_DIST_DIR']}")
      def is_published(wheel: Path) -> bool:
          return wheel.name in published_file_names(wheel.name.split("-", 1)[0])

      to_upload = []
      for wheel in wheels:
          if is_published(wheel):
              print(f"{wheel.name} is already published in {repository_url} - not uploaded")
          else:
              to_upload.append(wheel)
      if to_upload:
          command = ["twine", "upload", "--non-interactive", "--repository-url", repository_url, *map(str, to_upload)]
          print(" ".join(command), flush=True)
          returncode = subprocess.run(command).returncode
          if returncode != 0 and all(is_published(wheel) for wheel in to_upload):
              names = ", ".join(wheel.name for wheel in to_upload)
              print(f"twine upload failed, but {names} is now published in {repository_url} - published concurrently")
              sys.exit(0)
          sys.exit(returncode)
      EOF
